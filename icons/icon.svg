<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#waterGrad)"/>

  <!-- Water waves -->
  <path d="M 20 80 Q 35 70, 50 80 T 80 80 T 110 80 L 110 130 L 20 130 Z" fill="url(#waveGrad)" opacity="0.7"/>
  <path d="M 15 95 Q 30 88, 45 95 T 75 95 T 105 95 L 105 130 L 15 130 Z" fill="url(#waveGrad)" opacity="0.6"/>

  <!-- Water drop emoji style -->
  <path d="M 64 25 Q 55 35, 55 45 Q 55 60, 64 65 Q 73 60, 73 45 Q 73 35, 64 25 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Border -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#2980b9" stroke-width="4"/>
</svg>
